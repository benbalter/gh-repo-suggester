name: 'Repo Suggester'
description: >-
  Recommends repositories to watch within a GitHub organization
  based on your watched repos, powered by GitHub Models.
  Suggests the most appropriate watching type for each recommendation.

inputs:
  org:
    description: 'GitHub organization to recommend repos from'
    required: true
  token:
    description: 'GitHub token — use the default GITHUB_TOKEN with `models: read` permission'
    required: false
    default: ${{ github.token }}
  model:
    description: 'GitHub Models model ID'
    required: false
    default: 'openai/gpt-4o-mini'
  count:
    description: 'Number of repos to recommend'
    required: false
    default: '5'
  topic:
    description: 'Optional topic filter to narrow org repos (e.g. "api")'
    required: false

outputs:
  recommendations:
    description: 'Markdown-formatted repo recommendations with suggested watch types'

runs:
  using: 'node20'
  main: 'dist/index.js'

branding:
  icon: 'eye'
  color: 'purple'
